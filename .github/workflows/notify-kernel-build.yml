name: notify-kernel-build

# Every push to 6.18/rc (a promotion or an automated stable merge) tells
# Citronics/citronics-kernel to build and release fresh deb packages.
# Requires the KERNEL_DISPATCH_TOKEN secret: a PAT with permission to send
# repository_dispatch to Citronics/citronics-kernel. Skips gracefully when
# the secret is absent.

on:
  push:
    branches:
      - '6.18/rc'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch kernel-rc-updated to citronics-kernel
        env:
          KERNEL_DISPATCH_TOKEN: ${{ secrets.KERNEL_DISPATCH_TOKEN }}
        run: |
          if [ -z "$KERNEL_DISPATCH_TOKEN" ]; then
            echo "KERNEL_DISPATCH_TOKEN not set — skipping dispatch"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $KERNEL_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Citronics/citronics-kernel/dispatches \
            -d '{"event_type":"kernel-rc-updated","client_payload":{"branch":"6.18/rc","sha":"${{ github.sha }}"}}'
          echo "Dispatched."
