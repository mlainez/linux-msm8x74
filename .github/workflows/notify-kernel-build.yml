name: notify-kernel-build

# Every push to an rc branch (a promotion or an automated stable merge) tells
# Citronics/citronics-kernel to build and release fresh deb packages.
#
# 6.12/rc is watched as well as 6.18/rc: 6.12 is the production series (its
# display works, the vram carveout still exists there) and as of 2026-08-05 its
# DVFS and thermal throttling are validated on hardware, so its debs need to
# reach the APT repository like 6.18's do.  citronics-kernel decides what to
# rebuild by comparing each entry's upstream commit against build-state.tsv, so
# a dispatch for one series does not rebuild the other.
# Requires the KERNEL_DISPATCH_TOKEN secret: a PAT with permission to send
# repository_dispatch to Citronics/citronics-kernel. Without the secret this
# job FAILS on purpose - see the guard below.

on:
  push:
    branches:
      - '6.18/rc'
      - '6.12/rc'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch kernel-rc-updated to citronics-kernel
        env:
          KERNEL_DISPATCH_TOKEN: ${{ secrets.KERNEL_DISPATCH_TOKEN }}
        run: |
          if [ -z "$KERNEL_DISPATCH_TOKEN" ]; then
            echo "::error::KERNEL_DISPATCH_TOKEN is not set: no kernel build was triggered for this push. Add the secret (a PAT that may send repository_dispatch to Citronics/citronics-kernel), or trigger the build by hand."
            exit 1
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $KERNEL_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Citronics/citronics-kernel/dispatches \
            -d '{"event_type":"kernel-rc-updated","client_payload":{"branch":"${{ github.ref_name }}","sha":"${{ github.sha }}"}}'
          echo "Dispatched."
