name: build-test

# Cross-build the FP2 kernel (zImage + both FP2 DTBs + modules) for every
# push to the 6.18 branches, using the config snapshot at
# .github/ci/linux.config (keep it in sync with buildroot's
# board/fairphone2/linux.config). See AGENTS.md §4.

on:
  push:
    branches:
      - '6.18/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf flex bison bc libssl-dev libelf-dev \
            u-boot-tools ccache

      - name: Configure
        run: |
          cp .github/ci/linux.config .config
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          # sanity: the FP2 essentials must have survived olddefconfig
          for opt in CONFIG_ARCH_QCOM CONFIG_QCOM_IOMMU CONFIG_DRM_MSM CONFIG_PM_DEVFREQ; do
            grep -q "^$opt=y" .config || { echo "::error::$opt missing from CI config"; exit 1; }
          done

      - name: Build zImage + DTBs
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j"$(nproc)" \
            zImage \
            qcom/qcom-msm8974pro-fairphone-fp2.dtb \
            qcom/qcom-msm8974pro-fairphone-fp2-headless.dtb

      - name: Build modules
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j"$(nproc)" modules

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fp2-kernel-${{ github.sha }}
          retention-days: 14
          path: |
            arch/arm/boot/zImage
            arch/arm/boot/dts/qcom/qcom-msm8974pro-fairphone-fp2.dtb
            arch/arm/boot/dts/qcom/qcom-msm8974pro-fairphone-fp2-headless.dtb
