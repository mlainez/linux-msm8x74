%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,msm8974-sndcard.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies Inc. MSM8974 ASoC sound card

maintainers:
  - Marc Lainez <marc.lainez@gmail.com>

description:
  Qualcomm MSM8974 based sound card using the q6afe/q6asm DSP front-end
  over APR and the WCD9320 (Taiko) codec on the SLIMbus back-end.

properties:
  compatible:
    const: qcom,msm8974-sndcard

  audio-routing:
    $ref: /schemas/types.yaml#/definitions/non-unique-string-array
    description:
      A list of the connections between audio components. Each entry is a
      pair of strings, the first being the connection's sink, the second
      being the connection's source. Valid names could be power supplies,
      MicBias of codec and the jacks on the board.

  aux-devs:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      List of phandles pointing to auxiliary devices, such as amplifiers,
      to be added to the sound card.

  model:
    $ref: /schemas/types.yaml#/definitions/string
    description: User visible long sound card name

patternProperties:
  ".*-dai-link$":
    description:
      Each subnode represents a dai link. Subnodes of each dai links would be
      cpu/codec dais.

    type: object

    properties:
      link-name:
        description: Indicates dai-link name and PCM stream name.
        $ref: /schemas/types.yaml#/definitions/string
        maxItems: 1

      cpu:
        description: Holds subnode which indicates cpu dai.
        type: object
        additionalProperties: false

        properties:
          sound-dai:
            maxItems: 1

      platform:
        description: Holds subnode which indicates platform dai.
        type: object
        additionalProperties: false

        properties:
          sound-dai:
            maxItems: 1

      codec:
        description: Holds subnode which indicates codec dai.
        type: object
        additionalProperties: false

        properties:
          sound-dai:
            minItems: 1
            maxItems: 8

    required:
      - link-name
      - cpu

    additionalProperties: false

required:
  - compatible
  - model

additionalProperties: false

examples:
  - |
    #include <dt-bindings/sound/qcom,q6afe.h>
    #include <dt-bindings/sound/qcom,q6asm.h>

    sound {
        compatible = "qcom,msm8974-sndcard";
        model = "Fairphone-2";
        audio-routing = "SPK_OUT", "LINEOUT1",
                        "SPK_OUT", "LINEOUT3";

        mm1-dai-link {
            link-name = "MultiMedia1";
            cpu {
                sound-dai = <&q6asmdai MSM_FRONTEND_DAI_MULTIMEDIA1>;
            };
        };

        slim-dai-link {
            link-name = "SLIM Playback";
            cpu {
                sound-dai = <&q6afedai SLIMBUS_0_RX>;
            };

            platform {
                sound-dai = <&q6routing>;
            };

            codec {
                sound-dai = <&wcd9320 0>;
            };
        };
    };
